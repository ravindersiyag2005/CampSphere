services:
  - type: web
    name: campus-hub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false        # set this in Render dashboard
      - key: JWT_SECRET
        sync: false        # set this in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false        # set to your Vercel URL in Render dashboard
